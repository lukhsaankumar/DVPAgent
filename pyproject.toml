[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvp-meeting-prep"
version = "0.1.0"
description = "POC for DVP meeting prep ingestion and generation"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.0.1",
  "openpyxl>=3.1.5",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  "mistune>=3.0.2",
  "simple-salesforce>=1.12.6",
  "google-genai>=1.0.0",
  "google-auth>=2.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "playwright>=1.45.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# e2e_smoke_test.py is a manual Playwright script (run directly: `python
# tests/e2e_smoke_test.py`), not part of the automated suite -- it needs
# requirements-dev.txt installed, which the automated suite doesn't. Its
# *_test.py name makes pytest try to collect it by default; without this it
# fails collection (ModuleNotFoundError: playwright) for anyone who hasn't
# installed requirements-dev.txt, even though `python -m pytest tests/` was
# never meant to run it.
addopts = ["--ignore=tests/e2e_smoke_test.py"]
