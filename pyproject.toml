[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvp-meeting-prep"
version = "0.1.0"
description = "POC for DVP meeting prep ingestion and generation"
requires-python = ">=3.13"
dependencies = [
  "python-dotenv>=1.0.1",
  "supabase>=2.6.0",
  "openai>=1.40.0",
  "openpyxl>=3.1.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
