[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvp-meeting-prep"
version = "0.1.0"
description = "POC for DVP meeting prep ingestion and generation"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.0.1",
  "supabase>=2.6.0",
  "openai>=1.40.0",
  "openpyxl>=3.1.5",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "python-docx>=1.1.2",
  "mistune>=3.0.2",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "playwright>=1.45.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
